<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Notifications — Alliance d'Amour</title>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="nav-container">
      <a class="brand" href="/index.html">
        <div class="logo">Alliance d'Amour</div>
      </a>
      <nav class="main-nav">
        <a href="/index.html">Accueil</a>
        <a href="/decouvrir.html">Découvrir</a>
        <a href="/notifications.html">Notifications</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h1>Notifications</h1>
      <ul class="notification-list">
        <li class="notification-item unread">
          <div class="notif-head"><strong>Nouveau match</strong><small class="muted">Aujourd'hui</small></div>
          <div class="notif-body">Vous avez un nouveau match avec Paul. <a href="#">Voir</a></div>
          <div class="notif-actions"><span class="muted">Non lu</span></div>
        </li>
        <li class="notification-item read">
          <div class="notif-head"><strong>Nouveau message</strong><small class="muted">Hier</small></div>
          <div class="notif-body">Nouveau message de Marie. <a href="#">Lire</a></div>
          <div class="notif-actions"><span class="muted">Lu</span></div>
        </li>
      </ul>
    </section>
  </main>

  <script src="/assets/js/main.js"></script>
</body>
</html>
